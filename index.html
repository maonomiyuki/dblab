<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAR Complete Demo</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* ★変更：ボタンをまとめる「透明な箱」のデザイン */
      #ui-container {
        position: fixed;
        bottom: 30px;        /* 下からの位置 */
        left: 0;
        width: 100%;         /* 横幅いっぱい */
        display: flex;       /* 中身を横並びにする魔法の呪文 */
        justify-content: center; /* 中央寄せ（左右に離したい場合は space-between にする） */
        gap: 20px;           /* ボタン同士の間隔 */
        z-index: 1000;       /* 最前面 */
        pointer-events: none; /* ボタン以外の場所はタッチをARに通す設定 */
      }

      /* ★変更：ボタン共通デザイン（位置指定を削除） */
      .ar-button {
        /* position: fixed; ← 削除（箱の方で位置を決めるため） */
        /* left: ...        ← 削除 */
        /* bottom: ...      ← 削除 */
        /* transform: ...   ← 削除 */
        
        pointer-events: auto; /* ボタン自体は押せるようにする */
        
        padding: 10px 0;      /* 横幅固定にするので左右パディングは0でもOK */
        width: 140px;         /* 2つ並ぶので少し幅を調整 */
        color: white;
        border: none;
        border-radius: 30px;
        font-size: 14px;      /* 文字がはみ出ないよう少し小さく */
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }

      .ar-button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 3px rgba(0,0,0,0.3);
      }

      /* 色の設定 */
      #toggle-button {
        background-color: #2196F3;
      }
      #play-button {
        background-color: #ff4081;
      }
    </style>
  </head>
  
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.01;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <img id="img-back" src="./layer_back.png" />
        <img id="img-middle" src="./layer_middle.png" />
        <img id="img-front" src="./layer_front.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image src="#img-back" position="0 0 0" height="2" width="2"></a-image>
        <a-image src="#img-middle" position="0 0 0.7" height="2" width="2"></a-image>
        <a-image id="target-layer" src="#img-front" position="0 0 1.5" height="2" width="2"></a-image>
      </a-entity>
    </a-scene>

    <div id="ui-container">
      <button id="toggle-button" class="ar-button">Hide Logo</button>
      <button id="play-button" class="ar-button">🎵 Voice Play</button>
    </div>
    
    <audio id="bgm" src="./voice.mp3"></audio>

    <script>
      // 機能はそのままです
      const playBtn = document.getElementById('play-button');
      const audio = document.getElementById('bgm');

      playBtn.addEventListener('click', function() {
        if (audio.paused) {
          audio.play();
          playBtn.innerText = "🔇 Stop";
          playBtn.style.backgroundColor = "#555";
        } else {
          audio.pause();
          audio.currentTime = 0;
          playBtn.innerText = "🎵 Voice Play";
          playBtn.style.backgroundColor = "#ff4081";
        }
      });

      const toggleBtn = document.getElementById('toggle-button');
      const targetLayer = document.getElementById('target-layer');

      toggleBtn.addEventListener('click', function() {
        const isVisible = targetLayer.getAttribute('visible') !== false;

        if (isVisible) {
          targetLayer.setAttribute('visible', false);
          toggleBtn.innerText = "Show Logo";
          toggleBtn.style.backgroundColor = "#555";
        } else {
          targetLayer.setAttribute('visible', true);
          toggleBtn.innerText = "Hide Logo";
          toggleBtn.style.backgroundColor = "#2196F3";
        }
      });
    </script>
  </body>
</html>
