<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 New Year AR</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #f0f0f0; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <model-viewer 
        id="ar-model"
        src="2026_ar.glb"
        ios-src="" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="auto"
        camera-controls 
        shadow-intensity="1"
        auto-rotate
        autoplay
    >
        <button slot="ar-button" style="
            position: absolute; 
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px; 
            border-radius: 30px; 
            border: none;
            background: white; 
            color: #333; 
            font-weight: bold;
            font-family: sans-serif;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
            👋 ARで見る
        </button>
    </model-viewer>

    <script>
        // 【重要】アニメーションのトラブルシューティング用スクリプト
        const modelViewer = document.querySelector("#ar-model");

        modelViewer.addEventListener("load", () => {
            // モデルが持っているアニメーションの名前をコンソールに表示
            console.log("Available animations:", modelViewer.availableAnimations);

            // アニメーションが1つでもある場合、強制的に最初のアニメーション名をセットして再生する
            if (modelViewer.availableAnimations.length > 0) {
                modelViewer.animationName = modelViewer.availableAnimations[0];
                modelViewer.play();
                console.log("Playing animation:", modelViewer.animationName);
            }
        });
    </script>

</body>
</html>
